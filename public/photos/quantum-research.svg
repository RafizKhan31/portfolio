<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071A"/>
      <stop offset="100%" stop-color="#140D36"/>
    </linearGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08071A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#qBg)"/>

  <!-- Left: Bloch Sphere 3D Representation -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="130" fill="url(#sphereGlow)"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="120" ry="35" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="35" ry="120" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    
    <!-- Axes -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Poles -->
    <text x="0" y="-150" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">|0⟩ (Z-basis)</text>
    <text x="0" y="165" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">|1⟩</text>

    <!-- State Vector |ψ⟩ -->
    <line x1="0" y1="0" x2="60" y2="-75" stroke="#34D399" stroke-width="3"/>
    <circle cx="60" cy="-75" r="5" fill="#34D399"/>
    <text x="75" y="-80" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">|ψ⟩ State</text>
  </g>

  <!-- Right: Quantum Circuit & Benchmark Card -->
  <g transform="translate(390, 60)">
    <!-- Circuit Card -->
    <rect width="360" height="175" rx="12" fill="#140D36" stroke="#8B5CF6" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="30" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold">PARAMETERIZED QUANTUM CIRCUIT (PQC)</text>

    <!-- Wire Q0 -->
    <g transform="translate(20, 50)">
      <text x="0" y="18" fill="#38BDF8" font-family="monospace" font-size="11">|q0⟩</text>
      <line x1="35" y1="14" x2="310" y2="14" stroke="#64748B" stroke-width="1.5"/>
      <rect x="50" y="0" width="28" height="28" rx="4" fill="#3B82F6"/>
      <text x="64" y="18" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">H</text>
      <rect x="110" y="0" width="44" height="28" rx="4" fill="#8B5CF6"/>
      <text x="132" y="18" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">Ry(θ0)</text>
      <circle cx="190" cy="14" r="5" fill="#06B6D4"/>
      <rect x="230" y="0" width="44" height="28" rx="4" fill="#8B5CF6"/>
      <text x="252" y="18" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">Rz(λ0)</text>
    </g>

    <!-- Wire Q1 -->
    <g transform="translate(20, 95)">
      <text x="0" y="18" fill="#38BDF8" font-family="monospace" font-size="11">|q1⟩</text>
      <line x1="35" y1="14" x2="310" y2="14" stroke="#64748B" stroke-width="1.5"/>
      <rect x="50" y="0" width="28" height="28" rx="4" fill="#3B82F6"/>
      <text x="64" y="18" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">H</text>
      <rect x="110" y="0" width="44" height="28" rx="4" fill="#8B5CF6"/>
      <text x="132" y="18" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">Rx(θ1)</text>
      <line x1="190" y1="-31" x2="190" y2="14" stroke="#06B6D4" stroke-width="2"/>
      <circle cx="190" cy="14" r="8" fill="none" stroke="#06B6D4" stroke-width="2"/>
      <line x1="184" y1="14" x2="196" y2="14" stroke="#06B6D4" stroke-width="2"/>
      <line x1="190" y1="8" x2="190" y2="20" stroke="#06B6D4" stroke-width="2"/>
    </g>

    <text x="20" y="155" fill="#10B981" font-family="monospace" font-size="10">Entanglement: Multi-qubit CNOT Bell States</text>

    <!-- Thesis Findings Card -->
    <rect y="195" width="360" height="175" rx="12" fill="#140D36" stroke="#06B6D4" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="225" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">THESIS BENCHMARK FINDING</text>
    <text x="20" y="250" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Hybrid Quantum-Classical Architecture</text>
    <text x="20" y="272" fill="#94A3B8" font-family="sans-serif" font-size="11">Empirical evaluation demonstrated that hybrid models</text>
    <text x="20" y="290" fill="#94A3B8" font-family="sans-serif" font-size="11">balance quantum Hilbert-space feature mapping with</text>
    <text x="20" y="308" fill="#94A3B8" font-family="sans-serif" font-size="11">robust classical backpropagation convergence.</text>
    <text x="20" y="340" fill="#34D399" font-family="monospace" font-size="11">5 Multi-domain Datasets Evaluated</text>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="475" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">QUANTUM NEURAL NETWORKS RESEARCH · THESIS STUDY</text>
</svg>
