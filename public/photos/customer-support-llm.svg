<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="llmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0720"/>
      <stop offset="100%" stop-color="#190B38"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#llmBg)"/>

  <!-- Left: Dialog Simulation Window -->
  <g transform="translate(60, 60)">
    <rect width="400" height="380" rx="16" fill="#130C2E" stroke="#8B5CF6" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Window top bar -->
    <rect width="400" height="40" rx="16" fill="#1F1345"/>
    <circle cx="25" cy="20" r="5" fill="#EF4444"/>
    <circle cx="42" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="20" r="5" fill="#10B981"/>
    <text x="80" y="24" fill="#C084FC" font-family="monospace" font-size="11">support-agent.gpt4 · RAG Mode</text>

    <!-- User Message Bubble -->
    <g transform="translate(25, 65)">
      <rect width="280" height="55" rx="12" fill="#241552" stroke="#4C1D95" stroke-width="1"/>
      <text x="15" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="12">How can I set up webhook triggers for</text>
      <text x="15" y="42" fill="#E2E8F0" font-family="sans-serif" font-size="12">unusual account balance discrepancies?</text>
    </g>

    <!-- AI Bot Message Bubble -->
    <g transform="translate(75, 140)">
      <rect width="300" height="110" rx="12" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="15" y="24" fill="#F3E8FF" font-family="sans-serif" font-size="12" font-weight="bold">AI Agent (Grounded RAG):</text>
      <text x="15" y="45" fill="#F3E8FF" font-family="sans-serif" font-size="11">1. Navigate to Settings &gt; Webhook Security.</text>
      <text x="15" y="65" fill="#F3E8FF" font-family="sans-serif" font-size="11">2. Enable &apos;Balance Anomaly Threshold&apos;.</text>
      <text x="15" y="85" fill="#F3E8FF" font-family="sans-serif" font-size="11">3. Enter HMAC signature key to verify payload.</text>
      <text x="15" y="102" fill="#34D399" font-family="monospace" font-size="9">Verified against internal KB doc #8291</text>
    </g>

    <!-- Input Box -->
    <g transform="translate(25, 310)">
      <rect width="350" height="45" rx="10" fill="#09041A" stroke="#3B1C74" stroke-width="1"/>
      <text x="15" y="27" fill="#6B7280" font-family="sans-serif" font-size="11">Type your technical inquiry...</text>
      <rect x="305" y="8" width="35" height="28" rx="6" fill="#8B5CF6"/>
      <path d="M 318 16 L 328 22 L 318 28 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Right: Architecture Metrics & Vector Retrieval Diagram -->
  <g transform="translate(490, 60)">
    <!-- RAG Vector Retrieval Box -->
    <rect width="250" height="115" rx="12" fill="#130C2E" stroke="#C084FC" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="30" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold">RAG RETRIEVAL PIPELINE</text>
    <text x="20" y="55" fill="#94A3B8" font-family="sans-serif" font-size="11">Embedding Model: text-emb-ada-002</text>
    <text x="20" y="75" fill="#94A3B8" font-family="sans-serif" font-size="11">Vector Index: Top-K = 4 Semantic Chunks</text>
    <text x="20" y="98" fill="#10B981" font-family="monospace" font-size="10">Zero Hallucination Guardrail Active</text>

    <!-- Evaluation Comparison Box -->
    <rect y="135" width="250" height="115" rx="12" fill="#130C2E" stroke="#34D399" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="165" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">BENCHMARK PERFORMANCE</text>
    <text x="20" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">+40%</text>
    <text x="75" y="190" fill="#94A3B8" font-family="sans-serif" font-size="11">Human Evaluation Win Rate</text>
    <text x="20" y="210" fill="#94A3B8" font-family="sans-serif" font-size="11">over standard RNN / Rule Baselines</text>
    <text x="20" y="233" fill="#C084FC" font-family="monospace" font-size="10">Latency: 420ms Time-to-First-Token</text>

    <!-- Token Economics Box -->
    <rect y="270" width="250" height="110" rx="12" fill="#130C2E" stroke="#F59E0B" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="300" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="bold">SYSTEM COST OPTIMIZATION</text>
    <text x="20" y="325" fill="#E2E8F0" font-family="sans-serif" font-size="11">Dynamic Prompt Pruning Engine</text>
    <text x="20" y="345" fill="#94A3B8" font-family="sans-serif" font-size="11">Context Window Compression: 38%</text>
    <text x="20" y="365" fill="#10B981" font-family="monospace" font-size="10">Cost per Resolution: $0.0034</text>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="475" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">LLM-POWERED CUSTOMER SUPPORT CHATBOT · ARCHITECTURE</text>
</svg>
