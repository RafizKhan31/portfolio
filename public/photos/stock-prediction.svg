<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#0A182F"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#finBg)"/>

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#60A5FA" stroke-width="1">
    <line x1="80" y1="100" x2="720" y2="100"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="260" x2="720" y2="260"/>
    <line x1="80" y1="340" x2="720" y2="340"/>
    <line x1="200" y1="80" x2="200" y2="380"/>
    <line x1="360" y1="80" x2="360" y2="380"/>
    <line x1="520" y1="80" x2="520" y2="380"/>
    <line x1="680" y1="80" x2="680" y2="380"/>
  </g>

  <!-- Financial Candlesticks -->
  <g opacity="0.75">
    <!-- Candle 1 (Green) -->
    <line x1="120" y1="210" x2="120" y2="280" stroke="#10B981" stroke-width="2"/>
    <rect x="113" y="230" width="14" height="40" fill="#10B981" rx="1"/>

    <!-- Candle 2 (Green) -->
    <line x1="160" y1="190" x2="160" y2="260" stroke="#10B981" stroke-width="2"/>
    <rect x="153" y="210" width="14" height="35" fill="#10B981" rx="1"/>

    <!-- Candle 3 (Red) -->
    <line x1="200" y1="200" x2="200" y2="290" stroke="#EF4444" stroke-width="2"/>
    <rect x="193" y="220" width="14" height="50" fill="#EF4444" rx="1"/>

    <!-- Candle 4 (Green) -->
    <line x1="240" y1="170" x2="240" y2="250" stroke="#10B981" stroke-width="2"/>
    <rect x="233" y="190" width="14" height="45" fill="#10B981" rx="1"/>

    <!-- Candle 5 (Green) -->
    <line x1="280" y1="150" x2="280" y2="230" stroke="#10B981" stroke-width="2"/>
    <rect x="273" y="165" width="14" height="45" fill="#10B981" rx="1"/>

    <!-- Candle 6 (Red) -->
    <line x1="320" y1="170" x2="320" y2="240" stroke="#EF4444" stroke-width="2"/>
    <rect x="313" y="180" width="14" height="40" fill="#EF4444" rx="1"/>

    <!-- Candle 7 (Green) -->
    <line x1="360" y1="130" x2="360" y2="210" stroke="#10B981" stroke-width="2"/>
    <rect x="353" y="145" width="14" height="45" fill="#10B981" rx="1"/>

    <!-- Candle 8 (Green) -->
    <line x1="400" y1="120" x2="400" y2="190" stroke="#10B981" stroke-width="2"/>
    <rect x="393" y="130" width="14" height="40" fill="#10B981" rx="1"/>
  </g>

  <!-- LSTM Predicted Forecast Curved Area & Line -->
  <path d="M 400 130 C 460 110, 520 150, 580 90 C 630 60, 680 75, 710 50 L 710 380 L 400 380 Z" fill="url(#chartGrad)"/>
  <path d="M 120 250 Q 200 230 280 185 T 400 130 C 460 110, 520 150, 580 90 C 630 60, 680 75, 710 50" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Baseline Model Curve (Dotted for comparison) -->
  <path d="M 400 130 Q 480 170 560 140 T 710 110" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Prediction Point Indicator -->
  <circle cx="710" cy="50" r="8" fill="#38BDF8" opacity="0.4"/>
  <circle cx="710" cy="50" r="5" fill="#38BDF8"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(80, 30)">
    <rect width="640" height="50" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="30" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold">MODEL: BIDIRECTIONAL LSTM + NLP SENTIMENT</text>
    <text x="440" y="30" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">ACCURACY BOOST: +15.2%</text>
  </g>

  <!-- Bottom Analytics Badges -->
  <g transform="translate(80, 400)">
    <rect width="180" height="60" rx="8" fill="#090D16" stroke="#3B82F6" stroke-width="1"/>
    <text x="15" y="25" fill="#60A5FA" font-family="monospace" font-size="10">INPUT CHANNEL 1</text>
    <text x="15" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">OHLCV Temporal Feed</text>
  </g>

  <g transform="translate(280, 400)">
    <rect width="190" height="60" rx="8" fill="#090D16" stroke="#10B981" stroke-width="1"/>
    <text x="15" y="25" fill="#34D399" font-family="monospace" font-size="10">INPUT CHANNEL 2</text>
    <text x="15" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">NLP Sentiment Polarity</text>
  </g>

  <g transform="translate(490, 400)">
    <rect width="230" height="60" rx="8" fill="#090D16" stroke="#F59E0B" stroke-width="1"/>
    <text x="15" y="25" fill="#FBBF24" font-family="monospace" font-size="10">CLOUD DEPLOYMENT</text>
    <text x="15" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">AWS Lambda &amp; EventBridge</text>
  </g>
</svg>
