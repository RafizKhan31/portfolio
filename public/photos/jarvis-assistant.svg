<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#jarvisBg)"/>

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central Arc Reactor / AI Voice Hologram Core -->
  <circle cx="400" cy="250" r="140" fill="url(#coreGlow)"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="400" cy="250" r="95" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.8"/>
  <circle cx="400" cy="250" r="70" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="14 4"/>
  <circle cx="400" cy="250" r="45" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="400" cy="250" r="18" fill="#38BDF8"/>

  <!-- Radiating Angle Markers -->
  <g stroke="#06B6D4" stroke-width="2" opacity="0.7">
    <line x1="400" y1="110" x2="400" y2="125"/>
    <line x1="400" y1="375" x2="400" y2="390"/>
    <line x1="260" y1="250" x2="275" y2="250"/>
    <line x1="525" y1="250" x2="540" y2="250"/>
  </g>

  <!-- Waveform Spectrum Visualizer -->
  <g fill="url(#neonCyan)" opacity="0.9">
    <rect x="180" y="240" width="4" height="20" rx="2"/>
    <rect x="195" y="230" width="4" height="40" rx="2"/>
    <rect x="210" y="215" width="4" height="70" rx="2"/>
    <rect x="225" y="225" width="4" height="50" rx="2"/>
    <rect x="240" y="235" width="4" height="30" rx="2"/>

    <rect x="555" y="235" width="4" height="30" rx="2"/>
    <rect x="570" y="225" width="4" height="50" rx="2"/>
    <rect x="585" y="215" width="4" height="70" rx="2"/>
    <rect x="600" y="230" width="4" height="40" rx="2"/>
    <rect x="615" y="240" width="4" height="20" rx="2"/>
  </g>

  <!-- HUD Telemetry cards -->
  <g transform="translate(60, 60)">
    <rect width="210" height="70" rx="8" fill="#090D16" stroke="#0284C7" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="25" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">VOICE RECOGNITION</text>
    <text x="15" y="45" fill="#E2E8F0" font-family="sans-serif" font-size="13">PyAudio · Vosk · Google STT</text>
    <text x="15" y="60" fill="#10B981" font-family="monospace" font-size="10">● REALTIME ACTIVE (44.1 kHz)</text>
  </g>

  <g transform="translate(530, 60)">
    <rect width="210" height="70" rx="8" fill="#090D16" stroke="#6366F1" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="25" fill="#818CF8" font-family="monospace" font-size="11" font-weight="bold">NATURAL LANGUAGE NLU</text>
    <text x="15" y="45" fill="#E2E8F0" font-family="sans-serif" font-size="13">OpenAI GPT-4 + Local NLP</text>
    <text x="15" y="60" fill="#38BDF8" font-family="monospace" font-size="10">Confidence Score: 98.4%</text>
  </g>

  <g transform="translate(60, 370)">
    <rect width="210" height="70" rx="8" fill="#090D16" stroke="#10B981" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="25" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">TASK AUTOMATION</text>
    <text x="15" y="45" fill="#E2E8F0" font-family="sans-serif" font-size="13">OS · Browser · Desktop APIs</text>
    <text x="15" y="60" fill="#94A3B8" font-family="monospace" font-size="10">14 Modular Custom Plugins</text>
  </g>

  <g transform="translate(530, 370)">
    <rect width="210" height="70" rx="8" fill="#090D16" stroke="#F59E0B" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="25" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="bold">SPEECH SYNTHESIS</text>
    <text x="15" y="45" fill="#E2E8F0" font-family="sans-serif" font-size="13">pyttsx3 &amp; Neural Edge TTS</text>
    <text x="15" y="60" fill="#10B981" font-family="monospace" font-size="10">Latency: &lt; 280ms</text>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="475" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">JARVIS VIRTUAL ASSISTANT · ARCHITECTURE PHOTO</text>
</svg>
