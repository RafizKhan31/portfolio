<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pipeBg)"/>

  <!-- Connecting Flow Pipe Ribbon -->
  <path d="M 60 225 L 740 225" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 225 L 740 225" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- 7 Stages of ML Pipeline -->
  <!-- Stage 1: Data Ingestion -->
  <g transform="translate(60, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#06B6D4" stroke-width="2"/>
    <text x="0" y="5" fill="#38BDF8" font-family="sans-serif" font-size="16" text-anchor="middle">🗄️</text>
    <text x="0" y="-38" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 01</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ingestion</text>
    <text x="0" y="62" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">APIs &amp; SQL</text>
  </g>

  <!-- Stage 2: Preprocessing -->
  <g transform="translate(170, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#06B6D4" stroke-width="2"/>
    <text x="0" y="5" fill="#38BDF8" font-family="sans-serif" font-size="16" text-anchor="middle">🧹</text>
    <text x="0" y="-38" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 02</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cleaning</text>
    <text x="0" y="62" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Pandas/NumPy</text>
  </g>

  <!-- Stage 3: Feature Engineering -->
  <g transform="translate(285, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#3B82F6" stroke-width="2"/>
    <text x="0" y="5" fill="#60A5FA" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
    <text x="0" y="-38" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 03</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Features</text>
    <text x="0" y="62" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">TF-IDF &amp; Scaler</text>
  </g>

  <!-- Stage 4: Model Training -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="32" fill="#172554" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="0" y="6" fill="#93C5FD" font-family="sans-serif" font-size="18" text-anchor="middle">🧠</text>
    <text x="0" y="-42" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STAGE 04</text>
    <text x="0" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Deep Learning</text>
    <text x="0" y="67" fill="#60A5FA" font-family="monospace" font-size="9" text-anchor="middle">TF / PyTorch</text>
  </g>

  <!-- Stage 5: Evaluation -->
  <g transform="translate(515, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#6366F1" stroke-width="2"/>
    <text x="0" y="5" fill="#818CF8" font-family="sans-serif" font-size="16" text-anchor="middle">📊</text>
    <text x="0" y="-38" fill="#818CF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 05</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Evaluation</text>
    <text x="0" y="62" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Loss / F1 / ROC</text>
  </g>

  <!-- Stage 6: Cloud Deployment -->
  <g transform="translate(630, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#8B5CF6" stroke-width="2"/>
    <text x="0" y="5" fill="#A78BFA" font-family="sans-serif" font-size="16" text-anchor="middle">☁️</text>
    <text x="0" y="-38" fill="#A78BFA" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 06</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cloud Serving</text>
    <text x="0" y="62" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">AWS &amp; GCP</text>
  </g>

  <!-- Stage 7: Production REST API -->
  <g transform="translate(740, 225)">
    <circle cx="0" cy="0" r="28" fill="#0E2342" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="5" fill="#34D399" font-family="sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="0" y="-38" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STAGE 07</text>
    <text x="0" y="48" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Inference API</text>
    <text x="0" y="62" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">&lt; 150ms Latency</text>
  </g>

  <!-- Top Title Banner -->
  <text x="400" y="70" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">END-TO-END MACHINE LEARNING PRODUCTION PIPELINE</text>
  <text x="400" y="90" fill="#06B6D4" font-family="sans-serif" font-size="11" text-anchor="middle">Raw Ingestion → Distributed Training → Serverless Cloud Inference</text>
</svg>
